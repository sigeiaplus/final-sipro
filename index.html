<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIPRO | Entrar</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f3f4f6;
    color: #1f2937;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 28px 24px;
  }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .sub { margin: 0 0 20px; font-size: 14px; color: #6b7280; }
  label { display: block; margin: 14px 0 6px; font-size: 14px; font-weight: 600; }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 16px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
  }
  input:focus { outline: 2px solid #93c5fd; border-color: #3b82f6; }
  .ver { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 14px; font-weight: 400; }
  button {
    width: 100%;
    margin-top: 18px;
    padding: 11px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: #2563eb;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  button:disabled { background: #93c5fd; cursor: default; }
  .erro {
    display: none;
    margin-top: 14px;
    padding: 10px 12px;
    font-size: 14px;
    color: #991b1b;
    background: #fee2e2;
    border-radius: 6px;
  }
</style>
</head>
<body>
  <main class="card">
    <h1>SIPRO</h1>
    <p class="sub">Entre com seu CPF e senha.</p>

    <form id="form" novalidate>
      <label for="cpf">CPF</label>
      <input type="text" id="cpf" inputmode="numeric" autocomplete="username" placeholder="000.000.000-00" />

      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password" />

      <label class="ver"><input type="checkbox" id="ver" /> Mostrar senha</label>

      <div class="erro" id="erro" role="alert"></div>

      <button type="submit" id="entrar">Entrar</button>
    </form>
  </main>

<script>
  const form = document.getElementById('form');
  const cpfEl = document.getElementById('cpf');
  const senhaEl = document.getElementById('senha');
  const verEl = document.getElementById('ver');
  const erroEl = document.getElementById('erro');
  const botao = document.getElementById('entrar');

  function validarCpf(cpf) {
    if (!/^\d{11}$/.test(cpf)) return false;
    if (/^(\d)\1{10}$/.test(cpf)) return false;
    for (let t = 9; t < 11; t++) {
      let soma = 0;
      for (let i = 0; i < t; i++) soma += Number(cpf[i]) * (t + 1 - i);
      if (((soma * 10) % 11) % 10 !== Number(cpf[t])) return false;
    }
    return true;
  }

  function mostrarErro(msg) {
    erroEl.textContent = msg;
    erroEl.style.display = 'block';
  }

  function carregando(ativo) {
    botao.disabled = ativo;
    botao.textContent = ativo ? 'Entrando...' : 'Entrar';
  }

  verEl.addEventListener('change', () => {
    senhaEl.type = verEl.checked ? 'text' : 'password';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    erroEl.style.display = 'none';

    const cpf = cpfEl.value.replace(/\D/g, '');
    const senha = senhaEl.value;

    if (!validarCpf(cpf)) return mostrarErro('CPF inválido.');
    if (!senha) return mostrarErro('Informe a senha.');

    carregando(true);
    try {
      const resp = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cpf, senha }),
      });
      const dados = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        mostrarErro(dados.erro || 'Não foi possível entrar.');
        carregando(false);
        return;
      }
      location.href = dados.redirecionar || '/front.html';
    } catch (err) {
      mostrarErro('Sem conexão com o servidor. Tente novamente.');
      carregando(false);
    }
  });

  // Se já estiver logado, vai direto ao front.
  fetch('/api/me').then((r) => { if (r.ok) location.replace('/front.html'); }).catch(() => {});
</script>
</body>
</html>
